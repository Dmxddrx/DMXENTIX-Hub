; ============================================================
; DMXENTIX SoundNode - ESP32-C3 PlatformIO configuration
; ============================================================

[env:soundnode-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

upload_port = COM12
monitor_port = COM4

monitor_rts = 0
monitor_dtr = 0
monitor_speed = 115200
upload_speed = 460800

board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

lib_deps =
    h2zero/NimBLE-Arduino@2.5.2

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I include/config
    -I include/core
    -I include/drivers
    -I include/services
